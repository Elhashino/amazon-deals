name: gold-alert-backup
on:
  schedule:
    # CO-PRIMARY on this repo's proven scheduler (the newborn gold-alert repo
    # slept two days running). Same slots as the primary; the script's NY-hour
    # gate picks the right one and the gold-title dedupe prevents doubles if
    # the other repo ever wakes.
    - cron: '5 14 * * 1-5'
    - cron: '5 15 * * 1-5'
  workflow_dispatch: {}

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install dukascopy-python pandas numpy requests
      - run: python scripts/gold_alert_backup.py
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
